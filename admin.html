<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - تطبيق أثير</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: linear-gradient(135deg, #f5f7fa, #c3cfe2); height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: #333; margin-bottom: 15px; }
        textarea { width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: Tahoma, sans-serif; font-size: 16px; box-sizing: border-box; resize: none; margin-bottom: 15px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; }
        button:hover { background-color: #218838; }
        .back-link { display: inline-block; margin-top: 15px; color: #007bff; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
        #status { margin-top: 10px; color: green; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h1>لوحة التحكم</h1>
    <textarea id="messageInput" placeholder="اكتب الرسالة الجديدة هنا..."></textarea>
    <button onclick="saveMessage()">حفظ التغييرات</button>
    <div id="status"></div>
    <br>
    <a href="index.html" class="back-link">الذهاب للواجهة الرئيسية</a>
</div>

<script>
    // استرجاع الرسالة الحالية إذا وجدت
    const currentMessage = localStorage.getItem('atheerMessage');
    if (currentMessage) {
        document.getElementById('messageInput').value = currentMessage;
    }

    function saveMessage() {
        const msg = document.getElementById('messageInput').value;
        localStorage.setItem('atheerMessage', msg);
        
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = "تم الحفظ بنجاح!";
        setTimeout(() => {
            statusDiv.innerText = "";
        }, 3000);
    }
</script>

</body>
</html>
