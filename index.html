<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>أثير - التطبيق الكامل</title>
<style>
  :root{ --ink:#0d0b14; --panel:#161320; --panel2:#1f1b2c; --accent:#7c3aed; --accent2:#a855f7; --gold:#e0b23c; --ember:#e0724a; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--ink); color:#fff; font-family:"Tajawal","Segoe UI",system-ui,sans-serif; max-width:480px; margin-inline:auto; min-height:100vh; padding-bottom:64px; }
  .view{display:none;} .view.active{display:block;}
  /* استعادة التصميم القديم */
  .topbar{position:sticky; top:0; background:rgba(13,11,20,.95); padding:12px 16px; border-bottom:1px solid #333;}
  .card{background:var(--panel); border-radius:20px; padding:16px; margin:16px;}
  .rank-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #333;}
  .bottomnav{position:fixed; bottom:0; width:100%; max-width:480px; background:#0d0b14; display:flex; justify-content:space-around; padding:10px; border-top:1px solid #333;}
  .bottomnav button{background:none; border:none; color:#fff; cursor:pointer; display:flex; flex-direction:column; align-items:center;}
  /* تنسيق الكاميرا الجديد */
  #view-golive{position:fixed; inset:0; background:#000; z-index:999; display:none; flex-direction:column;}
  #view-golive.active{display:flex;}
</style>
</head>
<body>

  <!-- الشاشات القديمة كما هي -->
  <section class="view active" id="view-discover">
    <div class="topbar"><h1>اكتشف</h1></div>
    <div class="card">
      <h2>ترتيب الجيوش</h2>
      <div id="army-rankings"></div>
    </div>
    <div class="card">
      <h2>صناع المحتوى</h2>
      <div id="creator-rankings"></div>
    </div>
  </section>

  <!-- شاشة الكاميرا التي تظهر عند الضغط على + -->
  <section class="view" id="view-golive">
    <video id="liveStreamVideo" autoplay playsinline style="width:100%; height:80%; object-fit:cover;"></video>
    <div style="padding:20px; text-align:center;">
       <button onclick="toggleCamera()" id="btn-cam" style="padding:15px 30px; background:var(--accent); border:none; color:#fff; border-radius:10px; font-size:18px;">تشغيل الكاميرا</button>
       <button onclick="switchTab('view-discover')" style="padding:15px 30px; background:var(--ember); border:none; color:#fff; border-radius:10px; margin-right:10px;">إغلاق</button>
    </div>
  </section>

  <nav class="bottomnav">
    <button onclick="switchTab('view-profile')">👤 البروفايل</button>
    <button onclick="switchTab('view-discover')">🧭 اكتشف</button>
    <button onclick="switchTab('view-golive')" style="background:var(--accent); border-radius:10px; padding:5px 15px;">+</button>
    <button onclick="switchTab('view-video')">▶️ فيديو</button>
    <button onclick="switchTab('view-live')">💬 LIVE</button>
  </nav>

<script>
  // البيانات القديمة
  const armyRankings = [{name:"TOP ARMY",exp:"1.7M"},{name:"Final tune",exp:"659K"},{name:"M3 - HA",exp:"603K"}];
  const creatorRankings = [{name:"Ghala",exp:"2.7M"},{name:"بووووو",exp:"2.4M"},{name:"تك تاك",exp:"1.6M"}];
  
  document.getElementById("army-rankings").innerHTML = armyRankings.map(a => `<div class="rank-row"><span>${a.exp}</span><span>${a.name}</span></div>`).join("");
  document.getElementById("creator-rankings").innerHTML = creatorRankings.map(c => `<div class="rank-row"><span>${c.exp}</span><span>${c.name}</span></div>`).join("");

  function switchTab(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  let stream = null;
  async function toggleCamera() {
    if(!stream) {
      stream = await navigator.mediaDevices.getUserMedia({video:true});
      document.getElementById("liveStreamVideo").srcObject = stream;
      document.getElementById("btn-cam").textContent = "إيقاف";
    } else {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
      document.getElementById("btn-cam").textContent = "تشغيل الكاميرا";
    }
  }
</script>
</body>
</html>
