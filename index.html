<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أثير</title>
<style>
:root{--ink:#0d0b14;--panel:#161320;--panel2:#1f1b2c;--accent:#7c3aed;--gold:#e0b23c;--ember:#e0724a;}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:#fff;font-family:Tahoma,sans-serif;max-width:480px;margin-inline:auto;min-height:100vh;padding-bottom:60px}
.topbar{position:sticky;top:0;background:rgba(13,11,20,.95);padding:12px 16px;z-index:10;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:15px;overflow-x:auto;padding:8px 16px}.tabs button{background:none;border:none;color:rgba(255,255,255,.5);font-weight:600;font-size:15px;cursor:pointer}
.tabs button.active{color:#fff;border-bottom:2px solid #fff}
.view{display:none;padding:16px}.view.active{display:block}
.card{background:var(--panel);border-radius:16px;padding:14px;margin-bottom:15px}
.rank-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.room{background:var(--panel);border-radius:14px;overflow:hidden;cursor:pointer;text-align:right}
.room .thumb{height:140px;background:#221b33;display:flex;align-items:center;justify-content:center;font-size:36px}
.bottomnav{position:fixed;bottom:0;inset-inline:0;max-width:480px;margin-inline:auto;background:rgba(13,11,20,.95);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 0;z-index:100}
.bottomnav button{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;font-size:11px;cursor:pointer;gap:2px}
.bottomnav .cta span{width:36px;height:28px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px}
.overlay{position:fixed;inset:0;max-width:480px;margin-inline:auto;background:var(--panel2);display:none;flex-direction:none;z-index:50}
.overlay.active{display:flex}
</style>
</head>
<body>

<section class="view active" id="view-discover">
  <div class="topbar"><span>💬</span><strong>اكتشف</strong><span>🔍</span></div>
  <div class="card">
    <h3>ترتيب الجيوش</h3>
    <div id="armies"></div>
  </div>
  <div class="card" style="background:#fff;color:#000;">
    <h3>💎 صناع المحتوى</h3>
    <div id="creators"></div>
  </div>
</section>

<section class="view" id="view-live">
  <div class="tabs" id="livetabs"></div>
  <div class="grid" id="livegrid"></div>
</section>

<section class="view" id="view-video">
  <div style="text-align:center;margin-top:100vh;color:#777">مشغل الفيديو</div>
</section>

<section class="view" id="view-profile">
  <div style="text-align:center;padding-top:40px">
    <div style="font-size:50px">🙂</div>
    <h3>زائر</h3>
    <button style="background:rgba(255,255,255,.1);border:none;color:#fff;padding:8px 16px;border-radius:8px">تعديل صفحتي</button>
  </div>
</section>

<section class="view" id="view-golive">
  <div style="height:100vh;display:flex;flex-direction:column;background:#000;position:relative">
    <button onclick="switchTab('discover');stopCam();" style="position:absolute;top:15px;left:15px;background:rgba(0,0,0,.5);border:none;color:#fff;width:30px;height:30px;border-radius:50%;z-index:10">✕</button>
    <video id="cam" autoplay playsinline muted style="flex:1;object-fit:cover"></video>
    <div style="padding:15px;background:var(--panel);display:flex;gap:10px">
      <button id="cambtn" onclick="toggleCam()" style="flex:1;background:var(--accent);border:none;color:#fff;padding:12px;border-radius:8px;font-weight:bold">تشغيل الكاميرا</button>
      <button onclick="switchTab('discover');stopCam();" style="background:var(--ember);border:none;color:#fff;padding:12px;border-radius:8px;font-weight:bold">إنهاء</button>
    </div>
  </div>
</section>

<nav class="bottomnav">
  <button onclick="switchTab('profile')"><span>👤</span>البروفايل</button>
  <button onclick="switchTab('discover')"><span>🧭</span>اكتشاف</button>
  <button class="cta" onclick="switchTab('golive')"><span>+</span></button>
  <button onclick="switchTab('video')"><span>▶️</span>فيديو</button>
  <button onclick="switchTab('live')"><span>💬</span>LIVE</button>
</nav>

<script>
const armies=[{name:"TOP ARMY",val:"1.7M"},{name:"Final tune",val:"659K"},{name:"M3 - HA",val:"603K"}];
const creators=[{name:"Ghala",val:"2.7M"},{name:"بووووو",val:"2.4M"},{name:"تك تاك",val:"1.6M"}];
const rooms=[{cat:"لك",title:"بث حصّة",host:"حصّة",avatar:"🇦🇪"},{cat:"ترفيه",title:"بث فراوله",host:"فراوله",avatar:"🍓"}];

document.getElementById("armies").innerHTML = armies.map(a=>`<div class="rank-row"><span>${a.val}</span><span>${a.name}</span></div>`).join("");
document.getElementById("creators").innerHTML = creators.map(c=>`<div class="rank-row"><span>${c.val}</span><span>${c.name}</span></div>`).join("");

let cat="لك";
function renderLive(){
  document.getElementById("livetabs").innerHTML = ["لك","ترفيه","ألعاب"].map(c=>`<button class="${c===cat?'active':''}" onclick="cat='${c}';renderLive()">${c}</button>`).join("");
  document.getElementById("livegrid").innerHTML = rooms.filter(r=>r.cat===cat).map(r=>`<div class="room"><div class="thumb">${r.avatar}</div><div style="padding:8px;font-size:12px"><b>${r.host}</b><br>${r.title}</div></div>`).join("") || '<p style="grid-column:1/-1;text-align:center;color:#777">لا توجد بثوث</p>';
}
renderLive();

function switchTab(t){
  ['discover','live','video','profile','golive'].forEach(v=>document.getElementById('view-'+v).classList.toggle('active',v===t));
  if(t!=='golive') stopCam();
}

let stream=null;
async function toggleCam(){
  const v=document.getElementById("cam");
  if(!stream){
    try{ stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true}); v.srcObject=stream; document.getElementById("cambtn").textContent="إيقاف"; }
    catch(e){alert("تعذر تشغيل الكاميرا");}
  }else{ stopCam(); }
}
function stopCam(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; document.getElementById("cam").srcObject=null; document.getElementById("cambtn").textContent="تشغيل الكاميرا"; }
}
</script>
</body>
</html>
