<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>أثير - التطبيق الحقيقي</title>
<style>
  :root{ --ink:#0d0b14; --panel:#161320; --accent:#7c3aed; }
  body{ margin:0; background:var(--ink); color:#fff; font-family:sans-serif; max-width:480px; margin-inline:auto; min-height:100vh; }
  .view { display: none; padding: 20px; }
  .view.active { display: block; }
  .profile-avatar{width:96px; height:96px; border-radius:50%; background:var(--panel); display:flex; align-items:center; justify-content:center; font-size:48px; margin: 0 auto;}
  .profile-name{font-size:24px; font-weight:800; margin:12px 0; text-align:center;}
  .login-box { text-align: center; margin-top: 50px; }
  input { padding: 10px; border-radius: 8px; border: none; width: 80%; margin-bottom: 10px; }
  button { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="login-screen" class="view">
    <div class="login-box">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="username-input" placeholder="أدخل اسمك...">
        <button onclick="login()">دخول</button>
    </div>
</div>

<!-- واجهة البروفايل -->
<div id="view-profile" class="view">
    <div class="profile-avatar">👤</div>
    <p id="display-name" class="profile-name">زائر</p>
    <button onclick="logout()" style="background: #e0724a;">تسجيل الخروج</button>
</div>

<script>
    // عند فتح التطبيق
    window.onload = function() {
        const savedUser = localStorage.getItem("userName");
        if (savedUser) {
            showProfile(savedUser);
        } else {
            document.getElementById("login-screen").classList.add("active");
        }
    };

    function login() {
        const name = document.getElementById("username-input").value;
        if (name) {
            localStorage.setItem("userName", name);
            showProfile(name);
        }
    }

    function showProfile(name) {
        document.getElementById("login-screen").classList.remove("active");
        document.getElementById("view-profile").classList.add("active");
        document.getElementById("display-name").innerText = name;
    }

    function logout() {
        localStorage.removeItem("userName");
        location.reload(); // إعادة تحميل الصفحة للعودة لشاشة الدخول
    }
</script>
</body>
</html>
