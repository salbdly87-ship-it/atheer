<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>أثير</title>
<style>
  :root{ --ink:#0d0b14; --panel:#161320; --accent:#7c3aed; --ember:#e0724a; }
  body{ margin:0; background:var(--ink); color:#fff; font-family:"Tajawal",sans-serif; max-width:480px; margin-inline:auto; min-height:100vh; padding-bottom:64px; }
  .view{display:none; padding:16px;} .view.active{display:block;}
  .topbar{position:sticky; top:0; background:var(--ink); padding:16px; display:flex; justify-content:space-between;}
  .card{background:var(--panel); padding:16px; border-radius:20px; margin-bottom:20px;}
  .bottomnav{position:fixed; bottom:0; width:100%; max-width:480px; background:var(--panel); display:flex; justify-content:space-around; padding:12px 0;}
  .bottomnav button{background:none; border:none; color:#fff; cursor:pointer;}
  .bottomnav button.cta{background:var(--accent); padding:10px 20px; border-radius:12px;}
</style>
</head>
<body>

<section class="view active" id="view-discover">
    <div class="topbar"><span>💬</span><h1>اكتشف</h1><span>🔍</span></div>
    <div class="card"><h2>ترتيب الجيوش</h2><div id="army-rankings">...</div></div>
</section>

<section class="view" id="view-live">
    <div class="topbar"><h1>البث المباشر</h1></div>
    <div id="live-grid">جاري تحميل البث...</div>
</section>

<section class="view" id="view-profile">
    <div class="topbar"><h1>البروفايل</h1></div>
    <div style="text-align:center;">
        <div style="font-size:60px;">🙂</div>
        <p id="user-display">زائر</p>
    </div>
</section>

<nav class="bottomnav">
    <button onclick="showView('discover')">🧭</button>
    <button onclick="showView('live')">💬</button>
    <button class="cta" onclick="showView('live')">+</button>
    <button onclick="showView('profile')">👤</button>
</nav>

<script>
    // 1. قفل الحماية
    if (!localStorage.getItem('atheerUser')) { window.location.href = "login.html"; }
    
    // 2. عرض اسم المستخدم
    document.getElementById('user-display').textContent = localStorage.getItem('atheerUser');

    // 3. تبديل الصفحات
    function showView(viewId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + viewId).classList.add('active');
    }
</script>
</body>
</html>
