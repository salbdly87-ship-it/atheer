<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول - أثير</title>
<style>
  :root{ --ink:#0d0b14; --panel:#161320; --accent:#7c3aed; }
  body{ margin:0; background:var(--ink); color:#fff; font-family:"Tajawal",sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; }
  .login-card{ background:var(--panel); padding:40px; border-radius:24px; width:90%; max-width:400px; text-align:center; border:1px solid #333; }
  h1{ margin-bottom:10px; color:var(--accent); }
  p{ color:rgba(255,255,255,.5); margin-bottom:30px; }
  input{ width:100%; padding:15px; margin:10px 0; border-radius:12px; border:1px solid #333; background:var(--ink); color:#fff; box-sizing:border-box; outline:none; font-family:inherit; }
  button{ width:100%; padding:15px; margin-top:20px; background:var(--accent); border:none; color:#fff; border-radius:12px; font-weight:bold; cursor:pointer; font-size:16px; font-family:inherit; }
  button:hover{ opacity:0.9; }
</style>
</head>
<body>

<div class="login-card">
    <h1>أثير</h1>
    <p>أهلاً بك، سجل دخولك للبدء</p>
    <input type="text" id="username" placeholder="اسم المستخدم">
    <input type="tel" id="phone" placeholder="رقم الجوال">
    <button onclick="login()">دخول إلى التطبيق</button>
</div>

<script>
    function login() {
        const name = document.getElementById('username').value.trim();
        const phone = document.getElementById('phone').value.trim();
        
        if(name && phone) {
            // حفظ اسم المستخدم في ذاكرة المتصفح
            localStorage.setItem('atheerUser', name);
            // الانتقال إلى الواجهة الرئيسية
            window.location.href = "index.html"; 
        } else {
            alert("يرجى إدخال اسم المستخدم ورقم الجوال كاملاً");
        }
    }
</script>
</body>
</html>
