<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - تطبيق أثير</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: linear-gradient(135deg, #f5f7fa, #c3cfe2); height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: #333; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; text-align: right; }
        button { background-color: #007bff; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; }
        button:hover { background-color: #0056b3; }
        #errorMsg { color: red; font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h1>تسجيل الدخول</h1>
    <div id="errorMsg"></div>
    <input type="text" id="username" placeholder="الاسم الكريم">
    <input type="text" id="identifier" placeholder="البريد الإلكتروني أو رقم الجوال">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button onclick="handleSubmit()">دخول</button>
</div>

<script>
    function handleSubmit() {
        const name = document.getElementById('username').value.trim();
        const identifier = document.getElementById('identifier').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('errorMsg');

        if (!name || !identifier || !password) {
            errorDiv.innerText = "الرجاء تعبئة جميع الحقول!";
            return;
        }

        localStorage.setItem('atheerUser', name);
        window.location.href = "index.html";
    }
</script>

</body>
</html>
