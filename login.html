<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - تطبيق أثير</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: linear-gradient(135deg, #a1c4fd, #c2e9fb); height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="card">
    <h1>تسجيل الدخول</h1>
    <form onsubmit="handleLogin(event)">
        <input type="text" id="username" placeholder="اسم المستخدم أو البريد" required>
        <input type="tel" id="phone" placeholder="رقم الجوال" required>
        <button type="submit" class="btn">دخول</button>
    </form>
</div>

<script>
    function handleLogin(event) {
        event.preventDefault();
        const username = document.getElementById('username').value;
        localStorage.setItem('atheerUser', username);
        window.location.href = "index.html";
    }
</script>

</body>
</html>
